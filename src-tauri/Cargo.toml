[package]
name = "zcode-usage-widget"
version = "3.0.2"
description = "ZCode 用量监控桌面组件（Tauri 版，真磨砂 Acrylic）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
hmac = "0.12"
sha2 = "0.10"
chrono = "0.4"
zstd = "0.13"
regex = "1"
urlencoding = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Multimedia"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
